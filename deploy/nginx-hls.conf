# Serves the streamer's HLS output: the `hls` profile of docker-compose.yml.
# http://<host>:8080/hls/<stream_name>/index.m3u8
#
# Only playlists and segments are served. Unlike the RTSP port, this one
# is reachable from any web page a browser on the LAN opens, so two checks
# keep such a page from reading the cameras:
#   - CORS: no other origin may read the files, unless listed below.
#     Players that fetch the files themselves (VLC, Home Assistant's
#     camera integration, Frigate) need no entry; a page served from
#     another origin that plays them in the browser (hls.js on your own
#     dashboard) does.
#   - Host: only requests addressed to an IP literal, a bare host name or
#     a local-only name (.local, .lan, .home.arpa, .internal) are answered;
#     any other name gets the connection closed. A public name resolving
#     to this box (DNS rebinding) would make the page same-origin with it.
#     Reached through a name of your own? Add it to `server_name` below.

# The origins allowed to read the files, one regex per line, e.g.
#     "~^https?://homeassistant\.local(:8123)?$" $http_origin;
map $http_origin $hls_cors_origin {
    default "";
}

# Any other Host: close the connection without an answer.
server {
    listen 8080 default_server;
    server_tokens off;
    return 444;
}

server {
    listen 8080;
    # Quoted: a regex with braces must be.
    server_name localhost
                "~^[0-9]{1,3}(\.[0-9]{1,3}){3}$"
                "~^\[[0-9a-fA-F:.]+\]$"
                "~^[A-Za-z0-9-]+$"
                *.local *.lan *.home.arpa *.internal;
    server_tokens off;
    root /usr/share/nginx/html;

    location /hls/ {
        # The playlist changes every segment: never cached.
        location ~ \.m3u8$ {
            add_header Cache-Control "no-cache" always;
            add_header Access-Control-Allow-Origin $hls_cors_origin always;
            add_header Vary Origin always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        # A segment never changes once listed.
        location ~ \.ts$ {
            add_header Cache-Control "max-age=60" always;
            add_header Access-Control-Allow-Origin $hls_cors_origin always;
            add_header Vary Origin always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        return 404;
    }

    location / {
        return 404;
    }
}
