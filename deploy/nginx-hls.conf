# Serves the streamer's HLS output: the `hls` profile of docker-compose.yml.
# http://<host>:8080/hls/<stream_name>/index.m3u8
#
# Only playlists and segments are served. Players on another origin (Home
# Assistant, a web page with hls.js) may fetch them: the segments are the
# same pictures the RTSP port already gives the LAN.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location /hls/ {
        # The playlist changes every segment: never cached.
        location ~ \.m3u8$ {
            add_header Cache-Control "no-cache" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        # A segment never changes once listed.
        location ~ \.ts$ {
            add_header Cache-Control "max-age=60" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        return 404;
    }

    location / {
        return 404;
    }
}
