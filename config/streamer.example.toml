# ---------------------------------------------------------------------------
# arlo-camera-streamer example configuration
#
# Copy to /etc/arlo-streamer/streamer.toml (or pass `--config <path>`)
# and edit the marked sections before running. Secrets MUST come from
# env vars — never write a password into this file.
#
# This file is parsed by a unit test in `streamer-domain`, so every key
# below is guaranteed to be accepted by the current binary.
# ---------------------------------------------------------------------------

[arlo]
# Arlo cloud account email (the one used to log into the Arlo app).
email              = "owner@example.com"
# Name of the env var holding the Arlo cloud account password.
# Never write the password into this file directly.
password_env       = "ARLO_PASSWORD"
# arlo-rs persists the session token, cookie jar and paired device id
# here so the second factor is only asked once. Path must be readable +
# writable by the streamer process. Permissions are forced to 0600.
session_cache_path = "/var/lib/arlo-streamer/session.json"

# Second factor for the first login (and whenever the cached session is
# rejected). Exactly one `[arlo.mfa]` block; pick a `kind`:
#   kind = "email" — the OTP mail is fetched over IMAP when the mailbox
#                    is locatable (`host` or `provider`) and `user` +
#                    `password_env` are set; otherwise the OTP is
#                    prompted on stdin (interactive setup only).
#   kind = "push"  — approve the prompt in the Arlo mobile app; headless.
#   kind = "sms"   — OTP prompted on stdin; not suitable headless.
[arlo.mfa]
kind         = "email"
# Either an explicit IMAP host or a provider shortcut
# (`gmail`, `outlook`, `hotmail`, `yahoo`). `host` wins when both are set.
host         = "imap.example.com"
# provider   = "gmail"
user         = "arlo-otp@example.com"
# Only the *name* of the env var goes here. The streamer reads
# `std::env::var("ARLO_IMAP_PASSWORD")` at boot.
password_env = "ARLO_IMAP_PASSWORD"
# port       = 993                # default (IMAPS)

# Push alternative (replace the block above):
# [arlo.mfa]
# kind               = "push"
# poll_interval_secs = 3          # default
# timeout_secs       = 120        # default; time to reach your phone

# ---------------------------------------------------------------------------
# WebRTC ingest (applies to every camera's `webrtcbin`)
# ---------------------------------------------------------------------------

[webrtc]
# Local ICE candidate gathering:
#   "dual" — IPv4 + IPv6 (default).
#   "ipv4" — IPv4 only; use it when IPv6 towards Arlo's gateway is broken
#            or slow to fail over (live activation then stalls on ICE).
ice_address_family = "dual"

# ---------------------------------------------------------------------------
# Output endpoints
# ---------------------------------------------------------------------------

[output]
# H.264 encoder for the live/idle pipeline. This encoder runs continuously
# per connected camera, so it dominates CPU (see the README "Performance"
# section).
#   "x264"  — software encoding, works everywhere (default).
#   "vaapi" — Intel/AMD GPU (QuickSync/VAAPI); near-zero CPU per camera.
#             Requires the `gstreamer1.0-vaapi` plugin and a `/dev/dri`
#             render node on the host.
video_encoder = "x264"
# Prometheus /metrics endpoint (per-camera state, transitions, live seconds).
metrics_bind = "127.0.0.1:9090"
# Operational /admin HTTP endpoint (force-wake, force-idle, state snapshot).
# Requires the STREAMER_ADMIN_TOKEN env var at boot.
admin_bind   = "127.0.0.1:9091"

[output.rtsp]
bind = "0.0.0.0:8554"

# Optional secondary outputs. Accepted by the parser but NOT wired in v1
# (see docs/adr/0002-rtsp-only-output-v1.md); the daemon logs a warning.
#
# [output.hls]
# dir             = "/var/cache/arlo-streamer/hls"
# segment_secs    = 2
# playlist_length = 10
#
# [output.dash]
# dir          = "/var/cache/arlo-streamer/dash"
# segment_secs = 2

# ---------------------------------------------------------------------------
# Cameras — one [[cameras]] block per Arlo device you want to expose.
# `arlo_device_id` is the opaque id from the Arlo cloud (visible in the
# Arlo iOS / Android app under device info).
# ---------------------------------------------------------------------------

[[cameras]]
arlo_device_id = "REPLACE_WITH_DEVICE_ID"
# URL path of the RTSP output: rtsp://<host>:8554/front_door
stream_name    = "front_door"
# codec_hint   = "h264"   # or "h265"; learned automatically on first stream

[cameras.cooldown]
debounce_secs       = 60     # hold-live after last motion (debounce window)
max_continuous_live = 300    # hard cap on continuous live time (battery save)
daily_live_budget   = 0      # 0 = unlimited; otherwise total live secs/day
budget_reset        = "00:00"

# Operational note:
#   Disable the official Arlo app's motion *recording* for every camera
#   exposed here. Arlo's cloud-recording job competes with the live
#   activation and will delay or block it.
