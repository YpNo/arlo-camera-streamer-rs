[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "0BSD",
    # foldhash (hashbrown 0.17, under indexmap/h2). OSI-approved, permissive.
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = [
    # General legacy/deprecated
    # { crate = "lazy_static", reason = "Use standard library's std::sync::OnceLock or once_cell" },
    { crate = "failure", reason = "Use thiserror or anyhow" },
    { crate = "net2", reason = "Deprecated in favor of socket2" },
    { crate = "futures-cpupool", reason = "Use tokio or rayon" },

    # Security: TLS and Crypto
    { crate = "openssl", reason = "Use rustls for memory-safe TLS" },
    { crate = "native-tls", reason = "Use rustls for memory-safe TLS" },
]

# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    # Duplicate-version allowances, one per older version, each naming the
    # crate that still requires it. Re-derive with
    # `cargo tree -i <crate>@<version>` after a lockfile change.
    { crate = "block-buffer@0.10.4", reason = "Required by digest v0.10 (sha1 v0.10, tungstenite); sha2 v0.11 (stealthscraper-rs) is on digest 0.11" },
    { crate = "cpufeatures@0.2.17", reason = "Required by sha1 v0.10 (tungstenite); sha2 v0.11 is on cpufeatures 0.3" },
    { crate = "crypto-common@0.1.7", reason = "Required by digest v0.10 (sha1 v0.10, tungstenite)" },
    { crate = "digest@0.10.7", reason = "Required by sha1 v0.10 (tungstenite v0.28); sha2 v0.11 (stealthscraper-rs) is on digest 0.11" },
    { crate = "getrandom@0.2.17", reason = "Required by ring v0.17" },
    { crate = "getrandom@0.3.4", reason = "Required by rand_core v0.9 (tungstenite) and jobserver" },
    { crate = "itertools@0.13.0", reason = "Required by bindgen v0.72 (btls-sys build dependency)" },
    { crate = "syn@2.0.117", reason = "Every proc-macro crate except futures-macro v0.3.34, which moved to syn 3" },
    { crate = "rand@0.9.4", reason = "Required by tungstenite v0.28 (stealthscraper-rs is on rand 0.10)" },
    { crate = "rand_core@0.9.5", reason = "Required by rand v0.9.4" },
    { crate = "thiserror@1.0.69", reason = "Required by tokio-socks v0.5" },
    { crate = "thiserror-impl@1.0.69", reason = "Required by thiserror v1.0.69" },
    { crate = "webpki-roots@0.26.11", reason = "Required by tokio-tungstenite v0.28 (arlo-rs); reqwest is on 1.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
