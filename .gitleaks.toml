# gitleaks configuration — the secret-scan workflow runs it over every
# pushed or PR commit range (merged side branches included) and weekly
# over the whole history; `gitleaks git --log-opts=--all` does the same
# locally.
title = "arlo-camera-streamer-rs"

[extend]
useDefault = true

# Arlo-specific shapes the default rules do not know.
[[rules]]
id = "arlo-session-cache"
description = "Committed arlo-rs session cache (access token / cookie jar)"
path = '''(^|/)(\.arlo[-_]streamer[-_])?session[^/]*\.json$'''

[[rules]]
id = "arlo-presigned-s3-url"
description = "Presigned S3 URL (a bearer capability) in a committed file"
regex = '''X-Amz-Signature=[0-9a-f]{16,}'''

[[rules]]
id = "arlo-egress-token"
description = "Watch-along egress token (a bearer capability) in a committed file"
regex = '''egressToken=[A-Za-z0-9%._-]{16,}'''

[[rules]]
id = "streamer-admin-token-env"
description = "A real admin token written next to its env var name"
regex = '''STREAMER_ADMIN_TOKEN=["\']?[A-Za-z0-9+/=_-]{32,}'''

[allowlist]
description = "Documented placeholders and synthetic fixtures"
# Only the banner image by path (binary); everything else is scanned, the
# example config and a committed .security/ included. Placeholders are
# matched whole: a real token that merely starts like one must not pass.
paths = [
  '''^docs/banner\.jpeg$''',
]
regexes = [
  '''X-Amz-Signature=(s|SECRET)([^0-9A-Za-z]|$)''',
  '''egressToken=(t|T|SECRET)([^A-Za-z0-9%._-]|$)''',
  '''secret-token-of-sixteen-bytes-or-more''',
  '''openssl rand -hex 32''',
]
