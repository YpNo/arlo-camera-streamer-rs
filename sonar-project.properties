sonar.projectKey=YpNo_arlo-camera-streamer-rs
sonar.organization=ypno

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=arlo-camera-streamer-rs
sonar.projectVersion=1.0

# Source layout — each crate's `src/` is production code. There are no
# integration-test directories yet; inline `#[cfg(test)] mod tests`
# blocks live inside `src/` and are necessarily indexed as production
# code (unavoidable for Rust without splitting the file). Add a
# `sonar.tests=` line the day a `crates/<name>/tests/` directory exists —
# SonarCloud refuses to index the same file in both sets, and a listed
# folder that does not exist aborts the scan.
sonar.sources=crates/streamer-domain/src,crates/streamer-app/src,crates/streamer-infra-arlo/src,crates/streamer-infra-media/src,crates/streamer-infra-ops/src,crates/streamer-bin/src

# Defensive exclusions: keep build artefacts, fuzz harnesses, benches,
# and worktree state out of every analysis pass even if the scanner
# walks above the configured roots.
sonar.exclusions=**/target/**,**/fuzz/**,**/benches/**,**/.claude/**,**/.agent/**

# Coverage is published to Codecov (see the `coverage` job in CI).
# Sonar's `sonar.coverageReportPaths` expects its own Generic Test
# Data XML schema, not the Cobertura output that tarpaulin produces,
# and there's no upstream Rust-aware reader in vanilla SonarCloud.
# Leaving the wiring in causes the scanner to abort with:
#     Error during parsing of the generic coverage report ...
# So Sonar runs as a pure static-analysis pass; Codecov remains the
# coverage source of truth.

# Encoding of the source code. Default is default system encoding.
sonar.sourceEncoding=UTF-8
