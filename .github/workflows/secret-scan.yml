name: Secret scan

# Separate from ci.yml so that it has no paths-ignore: docs/VALIDATION.md
# and .agent/JOURNAL.md are where live logs get pasted, and a docs-only
# push skipped the scan. The range is every commit the push or PR brings,
# side branches merged with --no-ff included (the gitleaks action scanned
# --first-parent only); the weekly run and a manual one scan the whole
# history. Rules and allow-list: .gitleaks.toml.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 1 * * 0'   # weekly, whole history
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned binary release, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
      - name: Commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          case "$EVENT" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "$zero" ] \
                || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                range="--all"   # a new branch or a forced push: everything
              else
                range="${BEFORE}..${AFTER}"
              fi ;;
            *) range="--all" ;;
          esac
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Scanning: $range"
      - name: Scan
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: gitleaks git --config .gitleaks.toml --log-opts="$RANGE" --redact --no-banner --exit-code 1 .
