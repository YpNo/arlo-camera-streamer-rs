name: Rust CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'   # weekly security audit on Sundays

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# A new push to the same PR/branch supersedes the running workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build deps (btls-sys/BoringSSL + GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev libclang-dev nasm golang-go \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build deps (btls-sys/BoringSSL + GStreamer)
        # The runtime plugins are for `streamer-infra-media/tests/live_session.rs`,
        # which runs a real WebRTC call and RTSP client; STREAMER_REQUIRE_GST_IT
        # makes a missing element fail the job instead of skipping the tests.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev libclang-dev nasm golang-go \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-nice
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-features
        env:
          STREAMER_REQUIRE_GST_IT: "1"

  security:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  doc:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev libclang-dev nasm golang-go \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev libclang-dev nasm golang-go \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-nice
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-tarpaulin (pinned binary release, checksum-verified)
        # Bump both lines together; the digest is the one GitHub publishes
        # for the release asset.
        env:
          TARPAULIN_VERSION: "0.37.5"
          TARPAULIN_SHA256: edd214e46aedd1692bf8601f9754da5c6ade83da78f73d291f5dd611c940b590
        run: |
          curl -fsSL -o tarpaulin.tar.gz \
            "https://github.com/xd009642/tarpaulin/releases/download/${TARPAULIN_VERSION}/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz"
          echo "${TARPAULIN_SHA256}  tarpaulin.tar.gz" | sha256sum --check --strict
          tar xzf tarpaulin.tar.gz -C /usr/local/bin cargo-tarpaulin
          rm tarpaulin.tar.gz
      - name: Run cargo-tarpaulin
        # Exclusions (files, not packages: `--exclude <pkg>` only stops a
        # package's tests from running while its lines still count, which
        # is how the first run reported the media crate at 0 %):
        # - `crates/streamer-bin/*` — composition root, only glue
        # - The GStreamer-bound media files count: `tests/live_session.rs`
        #   drives them through real WebRTC calls (STREAMER_REQUIRE_GST_IT
        #   makes a missing plugin fail instead of silently skipping).
        # - I/O-heavy infra-arlo files — `boot.rs` async auth, `events.rs`
        #   live MQTT bus, `stream_requester.rs` and `thumbnails.rs` real
        #   network calls. Their pure logic (`event_mapper.rs`, `error.rs`,
        #   the `build_arlo_rs_config` and `utf8_path` helpers) IS unit-tested
        #   inline; the wrappers belong to integration tests against a real
        #   Arlo account.
        # Threshold: 86 — measured 88.25 % on 2026-09-28 with the media files
        # counted. Raise deliberately; never set above what is held.
        env:
          STREAMER_REQUIRE_GST_IT: "1"
        run: |
          cargo tarpaulin --workspace --all-features --timeout 180 --out xml \
            --exclude arlo-camera-streamer \
            --exclude-files 'crates/streamer-bin/*' \
            --exclude-files 'crates/streamer-infra-arlo/src/boot.rs' \
            --exclude-files 'crates/streamer-infra-arlo/src/events.rs' \
            --exclude-files 'crates/streamer-infra-arlo/src/stream_requester.rs' \
            --exclude-files 'crates/streamer-infra-arlo/src/thumbnails.rs' \
            --fail-under 86
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Secrets are not readable in a job-level `if`, so the token is mapped
    # to the job environment and the scan step checks it: a fork or a
    # repository without the SonarCloud secret skips the scan instead of
    # failing the pipeline on "Not authorized".
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Skip notice
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not set; skipping the SonarCloud scan."
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        if: env.SONAR_TOKEN != ''
