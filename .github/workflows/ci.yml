name: Rust CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'   # weekly security audit on Sundays

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# A new push to the same PR/branch supersedes the running workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build deps (btls-sys/BoringSSL + GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev libclang-dev nasm golang-go \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build deps (btls-sys/BoringSSL + GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev libclang-dev nasm golang-go \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-features

  security:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  doc:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev libclang-dev nasm golang-go \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev libclang-dev nasm golang-go \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-tarpaulin (binary release)
        run: |
          curl -s https://api.github.com/repos/xd009642/tarpaulin/releases/latest \
            | grep browser_download_url | grep x86_64-unknown-linux-musl \
            | cut -d '"' -f 4 | xargs curl -L | tar xz -C /usr/local/bin
      - name: Run cargo-tarpaulin
        # Exclusions (files, not packages: `--exclude <pkg>` only stops a
        # package's tests from running while its lines still count, which
        # is how the first run reported the media crate at 0 %):
        # - `crates/streamer-bin/*` — composition root, only glue
        # - GStreamer-bound media files (`gst_pipeline.rs`, `rtsp.rs`,
        #   `webrtc_pipeline.rs`) need a running pipeline and a camera; the
        #   crate's pure modules (`live_watch`, `splice`, `pipeline_desc`,
        #   `multiplexer` with its fake registry, …) are unit-tested and count.
        # - I/O-heavy infra-arlo files — `boot.rs` async auth, `events.rs`
        #   live MQTT bus, `stream_requester.rs` and `thumbnails.rs` real
        #   network calls. Their pure logic (`event_mapper.rs`, `error.rs`,
        #   the `build_arlo_rs_config` and `utf8_path` helpers) IS unit-tested
        #   inline; the wrappers belong to integration tests against a real
        #   Arlo account.
        # Threshold: 84 — measured 84.13 % on 2026-09-27 (second CI run, media
        # crate's pure modules counted). Raise deliberately; never set above
        # what is held.
        run: |
          cargo tarpaulin --workspace --all-features --timeout 180 --out xml \
            --exclude arlo-camera-streamer \
            --exclude-files 'crates/streamer-bin/*' \
            --exclude-files 'crates/streamer-infra-media/src/gst_pipeline.rs' \
            --exclude-files 'crates/streamer-infra-media/src/rtsp.rs' \
            --exclude-files 'crates/streamer-infra-media/src/webrtc_pipeline.rs' \
            --exclude-files 'crates/streamer-infra-arlo/src/boot.rs' \
            --exclude-files 'crates/streamer-infra-arlo/src/events.rs' \
            --exclude-files 'crates/streamer-infra-arlo/src/stream_requester.rs' \
            --exclude-files 'crates/streamer-infra-arlo/src/thumbnails.rs' \
            --fail-under 86
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Secrets are not readable in a job-level `if`, so the token is mapped
    # to the job environment and the scan step checks it: a fork or a
    # repository without the SonarCloud secret skips the scan instead of
    # failing the pipeline on "Not authorized".
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Skip notice
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not set; skipping the SonarCloud scan."
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        if: env.SONAR_TOKEN != ''
