name: Rust CI

# A change is gated once, on its own pull request. The `plan` job decides
# what each run deserves, and every job keys off its outputs:
#   - pull request changing Rust code (crates/, config/, Cargo.*, the
#     toolchain and lint settings): format → clippy → test → doc, coverage,
#     SonarQube, plus the audit. Renovate's: no coverage or SonarQube.
#   - pull request changing a workflow only: format → clippy → test, to
#     exercise the actions; no coverage, doc or SonarQube.
#   - pull request changing the Dockerfile (or .dockerignore, .trivyignore):
#     the image is built and scanned, never pushed.
#   - any other pull request (Compose, deploy/, scripts/): the audit only.
#   - push to main bringing a version with no release yet: format → clippy
#     → test and the audit, then the release and the image. No coverage:
#     the change was covered on its pull request.
#   - any other push to main: the release job's image check only (a
#     released version missing a platform is rebuilt); the code was gated
#     on its pull request.
#   - weekly schedule: the audit, plus one coverage and SonarQube baseline
#     on main for the pull requests to compare against.
#   - workflow_dispatch: the gates; on main, then the release job.
# A stage that fails skips the costlier ones after it. Docs-only changes
# never trigger the workflow (paths-ignore); the secret scan has its own.
on:
  pull_request:
    branches: [main, master]
    paths-ignore: # keep in step with `push` below
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - ".agent/**"
      - "LICENSE*"
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - ".agent/**"
      - "LICENSE*"
  schedule:
    - cron: '0 0 * * 0'   # weekly security audit on Sundays
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Runners are pinned to ubuntu-24.04 (and ubuntu-24.04-arm): the jobs
# install GStreamer and build dependencies by package name, and the
# ubuntu-latest label moves to Ubuntu 26 from 2026-10-19. Move the pin
# deliberately, in its own change, once the packages are checked there.

permissions:
  contents: read

# A new push to the same PR supersedes the running workflow. Pushes to
# main are never cancelled: a release run cut after the tag but before the
# image left a version without an image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read # the files a pull request changes
    outputs:
      build: ${{ steps.plan.outputs.build }}
      docs: ${{ steps.plan.outputs.docs }}
      coverage: ${{ steps.plan.outputs.coverage }}
      sonar: ${{ steps.plan.outputs.sonar }}
      audits: ${{ steps.plan.outputs.audits }}
      image_pr: ${{ steps.plan.outputs.image_pr }}
      release_check: ${{ steps.plan.outputs.release_check }}
      new_version: ${{ steps.plan.outputs.new_version }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          is() { [ "$1" = true ]; }
          is_pr=false; [ "$EVENT" = pull_request ] && is_pr=true
          on_main=false
          case "$REF" in refs/heads/main|refs/heads/master) on_main=true;; esac
          main_push=false; { [ "$EVENT" = push ] && is $on_main; } && main_push=true
          dispatch=false; [ "$EVENT" = workflow_dispatch ] && dispatch=true
          # Only a manual run on main may release: on another branch it
          # would tag and publish unmerged code.
          main_dispatch=false; { is $dispatch && is $on_main; } && main_dispatch=true
          schedule=false; [ "$EVENT" = schedule ] && schedule=true
          bot_pr=false
          if is $is_pr; then
            case "$ACTOR" in 'renovate[bot]'|'dependabot[bot]') bot_pr=true;; esac
          fi
          fork_pr=false; is $is_pr && [ "$PR_REPO" != "$REPO" ] && fork_pr=true

          # What a pull request changes. An API error runs everything.
          code=false; ci=false; image=false
          if is $is_pr; then
            # A rename counts by both paths: moving a file out of crates/
            # changes the code too.
            if files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                --jq '.[] | .filename, (.previous_filename // empty)'); then
              has() { printf '%s\n' "$files" | grep -Eq "$1"; }
              has '^(crates/|config/|\.cargo/|Cargo\.(toml|lock)$|(clippy|rustfmt|rust-toolchain)\.toml$|sonar-project\.properties$)' && code=true
              has '^\.github/workflows/' && ci=true
              has '^(Dockerfile|\.dockerignore|\.trivyignore)$' && image=true
            else
              echo "::warning::cannot list the pull request's files; running every job"
              code=true; ci=true; image=true
            fi
          fi

          # Whether main now holds a version with no release yet. An API
          # error counts as new: the gates run, and the release job decides.
          new_version=false
          if is $main_push || is $main_dispatch; then
            version=v$(gh api "repos/$REPO/contents/Cargo.toml?ref=$SHA" --jq .content \
              | base64 -d | grep -m1 '^version' | cut -d'"' -f2)
            if out=$(gh release view "$version" -R "$REPO" --json tagName 2>&1); then
              echo "$version is released already"
            elif printf '%s' "$out" | grep -qi 'release not found'; then
              new_version=true
            else
              echo "::warning::cannot tell whether $version is released: $out"
              new_version=true
            fi
          fi

          build=false
          { { is $is_pr && { is $code || is $ci; }; } || is $new_version || is $dispatch || is $schedule; } && build=true
          docs=false; { is $is_pr && is $code; } && docs=true
          coverage=false; { { is $is_pr && is $code && ! is $bot_pr; } || is $schedule; } && coverage=true
          sonar=false; { is $coverage && ! is $fork_pr; } && sonar=true
          audits=false; { is $is_pr || is $new_version || is $dispatch || is $schedule; } && audits=true
          image_pr=false; { is $is_pr && is $image; } && image_pr=true
          release_check=false; { is $main_push || is $main_dispatch; } && release_check=true

          {
            echo "### Plan for \`$EVENT\` (code=$code, workflows=$ci, image=$image)"
            echo; echo '| job group | runs |'; echo '|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          out() {
            echo "$1=$2" >> "$GITHUB_OUTPUT"
            echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"
            echo "$1=$2"
          }
          out build "$build"
          out docs "$docs"
          out coverage "$coverage"
          out sonar "$sonar"
          out audits "$audits"
          out image_pr "$image_pr"
          out release_check "$release_check"
          out new_version "$new_version"

  format:
    name: Check Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Root of the build chain: everything below `needs` it, so a run the
    # plan keeps build-free stops here.
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [format]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build deps (btls-sys/BoringSSL + GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev libclang-dev nasm golang-go \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [clippy] # same build, warmed by clippy's cache; a lint failure skips it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build deps (btls-sys/BoringSSL + GStreamer)
        # The runtime plugins are for `streamer-infra-media/tests/live_session.rs`,
        # which runs a real WebRTC call and RTSP client; STREAMER_REQUIRE_GST_IT
        # makes a missing element fail the job instead of skipping the tests.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev libclang-dev nasm golang-go \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-nice
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-features
        env:
          STREAMER_REQUIRE_GST_IT: "1"

  # Licences, advisories, bans and sources. The secret scan has its own
  # workflow (secret-scan.yml), which runs on docs-only pushes too.
  security:
    name: Security & License Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [plan]
    if: needs.plan.outputs.audits == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.99.1
      - name: Install cargo-deny (pinned binary release, checksum-verified)
        # The action fetched its release asset with curl | tar and no
        # checksum; this is the same binary, verified like tarpaulin below.
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum --check --strict
          tar xzf cargo-deny.tar.gz --strip-components=1 -C /usr/local/bin "${name}/cargo-deny"
          rm cargo-deny.tar.gz
      - run: cargo deny check

  doc:
    name: Documentation Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [plan, clippy]
    if: needs.plan.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev libclang-dev nasm golang-go \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [plan, test]
    # The costliest job (instrumented rebuild + the GStreamer integration
    # tests, ~9 min): a pull request changing Rust code, and the weekly
    # baseline on main; never a dependency bot's PR or a merge.
    if: needs.plan.outputs.coverage == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential libssl-dev libclang-dev nasm golang-go \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-nice
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-tarpaulin (pinned binary release, checksum-verified)
        # Bump both lines together; the digest is the one GitHub publishes
        # for the release asset.
        env:
          TARPAULIN_VERSION: "0.37.5"
          TARPAULIN_SHA256: edd214e46aedd1692bf8601f9754da5c6ade83da78f73d291f5dd611c940b590
        run: |
          curl -fsSL -o tarpaulin.tar.gz \
            "https://github.com/xd009642/tarpaulin/releases/download/${TARPAULIN_VERSION}/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz"
          echo "${TARPAULIN_SHA256}  tarpaulin.tar.gz" | sha256sum --check --strict
          tar xzf tarpaulin.tar.gz -C /usr/local/bin cargo-tarpaulin
          rm tarpaulin.tar.gz
      - name: Run cargo-tarpaulin
        # Exclusions (files, not packages: `--exclude <pkg>` only stops a
        # package's tests from running while its lines still count, which
        # is how the first run reported the media crate at 0 %):
        # - `crates/streamer-bin/src/main.rs` — composition root, only glue
        #   (the binary's other modules count, with their tests).
        # - The GStreamer-bound media files count: `tests/live_session.rs`
        #   and `tests/rtsp_sessions.rs` drive them through real pipelines
        #   (STREAMER_REQUIRE_GST_IT makes a missing plugin fail instead of
        #   silently skipping).
        # - `streamer-infra-arlo/src/boot.rs` — the live login; its helpers
        #   are unit-tested inline.
        # - `streamer-infra-arlo/src/arlo_api.rs` — the calls through to the
        #   live arlo-rs client. The adapters around them are tested against
        #   the fake in the same file.
        # Threshold: 88 — measured 90.24 % on 2026-10-10 with these
        # exclusions. Raise deliberately; never set above what is held.
        env:
          STREAMER_REQUIRE_GST_IT: "1"
        run: |
          cargo tarpaulin --workspace --all-features --timeout 180 --out xml \
            --exclude-files 'crates/streamer-bin/src/main.rs' \
            --exclude-files 'crates/streamer-infra-arlo/src/boot.rs' \
            --exclude-files 'crates/streamer-infra-arlo/src/arlo_api.rs' \
            --fail-under 88
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [plan, test]
    if: needs.plan.outputs.sonar == 'true' # with coverage; not a fork's PR
    # Secrets are not readable in a job-level `if`, so the token is mapped
    # to the job environment and the scan step checks it: a fork or a
    # repository without the SonarCloud secret skips the scan instead of
    # failing the pipeline on "Not authorized".
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Skip notice
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not set; skipping the SonarCloud scan."
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: env.SONAR_TOKEN != ''

  # A pull request changing the Dockerfile builds the image and scans it,
  # as the release would (amd64 only), and pushes nothing: a broken build
  # or a fixable CRITICAL/HIGH used to surface only once a version was
  # tagged (0.2.0).
  image-check:
    name: Container image check (PR)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [plan]
    if: needs.plan.outputs.image_pr == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/image,tar=false
          # Reads the release builds' cache; writes nothing, so a pull
          # request never changes what a release starts from.
          cache-from: type=gha,scope=image-linux/amd64
      - name: Vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          input: /tmp/image
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  # The GitHub release: a push to main whose Cargo.toml version has no
  # release yet gets tagged `v<version>` with generated notes, once the
  # gates the plan ran for it passed (coverage and SonarQube ran on the
  # pull request). On every other push it only checks that each released
  # version's image exists for every platform; its gates were skipped by
  # the plan, hence `always()` and the explicit results below. The image
  # jobs key on `image_missing`, so an image is published once per version.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [plan, format, clippy, test, security]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.release_check == 'true' &&
      (needs.plan.outputs.new_version != 'true' ||
       (needs.format.result == 'success' && needs.clippy.result == 'success' &&
        needs.test.result == 'success' && needs.security.result == 'success'))
    permissions:
      contents: write
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.exists.outputs.created }}
      image_missing: ${{ steps.image.outputs.missing }}
      # The commit the version's tag points at: the image is built from
      # it, never from whatever main holds when a rebuild runs.
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags decide whether this version is released already

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | awk -F '"' '{print $2}')
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VERSION"

      - name: Check whether the release exists
        id: exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Only "not found" means absent: an API error used to count as
          # absent too and could cut a second release of a version.
          if out=$(gh release view "$VERSION" --json tagName 2>&1); then
            echo "Release $VERSION already exists. Skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -qi "release not found"; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::cannot tell whether $VERSION is released: $out"
            exit 1
          fi

      # The image jobs key on this, not on `created`: a run cancelled or
      # failed after the tag can be re-run and still publish the image.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is the image for this version published for every platform, in every registry?
        id: image
        env:
          GHCR: ghcr.io/${{ github.repository }}
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORMS: ${{ vars.IMAGE_PLATFORMS || '["linux/amd64"]' }}
        run: |
          # Every registry the image job publishes to: a tag pushed to GHCR
          # but refused by Docker Hub used to look complete. Lowercase for
          # the same reason as the image names below. Docker Hub's public
          # repository is read anonymously.
          refs="$GHCR:$VERSION"
          if [ -n "$HUB_USER" ]; then
            refs="$refs docker.io/$HUB_USER/$REPO_NAME:$VERSION"
          fi
          refs=$(printf '%s' "$refs" | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$PLATFORMS" | jq -r '.[]' | sort -u)
          missing=false
          for REF in $refs; do
            if manifest=$(docker manifest inspect "$REF" 2>/tmp/inspect.err); then
              # Attestation manifests carry os/arch "unknown"; skip them.
              have=$(printf '%s' "$manifest" \
                | jq -r '.manifests[]? | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' \
                | sort -u)
              lacking=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$have"))
              if [ -z "$lacking" ]; then
                echo "Image $REF exists for: $(printf '%s' "$have" | tr '\n' ' ')"
              else
                echo "Image $REF lacks: $(printf '%s' "$lacking" | tr '\n' ' ')"
                missing=true
              fi
            elif grep -qiE 'manifest unknown|no such manifest|not found' /tmp/inspect.err; then
              echo "No image for $REF yet."
              missing=true
            else
              # Any other error (an outage, a rate limit) is not "absent":
              # a guess here rebuilt and re-tagged a released version.
              echo "::error::cannot inspect $REF: $(cat /tmp/inspect.err)"
              exit 1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: steps.exists.outputs.created == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}

      - name: Commit the version is built from
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CREATED: ${{ steps.exists.outputs.created }}
        run: |
          # A new release tags this commit; an existing one keeps its tag.
          if [ "$CREATED" = "true" ]; then
            sha="$GITHUB_SHA"
          else
            sha=$(git rev-list -n 1 "refs/tags/$VERSION")
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$VERSION is built from $sha"

  # The container image, one per released version, to GHCR as
  # ghcr.io/<owner>/<repo>:<version>, :latest and :sha-<commit>, and to
  # Docker Hub as docker.io/<DOCKERHUB_USERNAME>/<repo> with the same tags
  # when the repository variable DOCKERHUB_USERNAME and the secret
  # DOCKERHUB_TOKEN are set (GHCR alone otherwise). Built per platform on a
  # native runner and pushed by digest to every registry at once, scanned,
  # then tagged as one manifest list per registry. The platforms come from
  # the repository variable IMAGE_PLATFORMS (set to
  # ["linux/amd64","linux/arm64"]; `linux/amd64` alone when unset), each on
  # a native runner — the arm64 runner is free for a public repository. A
  # QEMU build of the Rust + BoringSSL stage would take hours, hence native
  # runners. The release job rebuilds and re-tags a version whose published
  # manifest list lacks any configured platform, so adding a platform needs
  # no version bump; the rebuild checks out the version's tag, not main.
  # Each image is built into a local OCI layout and scanned there, before
  # any registry login: a digest that fails the gate is never pushed, and
  # the scanner never runs next to push credentials. The push then takes
  # the same build from the builder's cache. No crate is ever published:
  # `publish = false`.
  image:
    name: Container image (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    needs: [release]
    # always(): the release job's own gates may have been skipped by the
    # plan, and a skipped ancestor would skip this job too.
    if: always() && needs.release.result == 'success' && needs.release.outputs.image_missing == 'true'
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(vars.IMAGE_PLATFORMS || '["linux/amd64"]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false
      - name: Reproducible timestamps
        # The scan build and the push build below share them, so the
        # pushed image is the scanned one, layer for layer.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image names
        id: names
        env:
          GHCR: ghcr.io/${{ github.repository }}
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # OCI references must be lowercase; github.repository keeps the
          # owner's case (YpNo), which buildx refuses in an image name.
          names="$GHCR"
          if [ -n "$HUB_USER" ]; then
            names="$names,docker.io/$HUB_USER/$REPO_NAME"
          fi
          names=$(printf '%s' "$names" | tr '[:upper:]' '[:lower:]')
          echo "list=$names" >> "$GITHUB_OUTPUT"
          echo "ghcr=${names%%,*}" >> "$GITHUB_OUTPUT"
          echo "Publishing to: $names"
      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.list }}
          labels: |
            org.opencontainers.image.title=arlo-camera-streamer
            org.opencontainers.image.description=Battery-safe bridge from Arlo cameras to a local RTSP / HLS output for Frigate and other NVRs
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release.outputs.commit }}
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # A layout directory, not a tarball: Trivy opens an OCI image
          # only as a directory (an OCI tar fails with "index.json: not a
          # directory").
          outputs: type=oci,dest=/tmp/image,tar=false
          # Every layer, the builder's included, goes to the Actions cache
          # per platform: the dependency layer (crates, BoringSSL, the
          # GStreamer bindings) only changes with Cargo.lock, so the next
          # release compiles our crates only.
          cache-from: type=gha,scope=image-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.platform }}
      # Report HIGH and CRITICAL; stop on any fixable one (.trivyignore
      # holds the reviewed exceptions, none so far).
      - name: Vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The layout is a one-platform index (the image plus its
          # attestations); without this Trivy looks for linux/amd64 in it
          # and fails on the arm64 leg. The action has no platform input,
          # Trivy reads TRIVY_PLATFORM for --platform.
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          input: /tmp/image
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          input: /tmp/image
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
      - run: rm -rf /tmp/image
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=image-${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance and an SPDX SBOM are attached to every digest.
          provenance: mode=max
          sbom: true
          # One build, pushed by digest to every registry in the list (the
          # quoted name field is buildx's CSV form for several names).
          outputs: type=image,"name=${{ steps.names.outputs.list }}",push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
          echo "$PLATFORM -> $DIGEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-publish:
    name: Tag the image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [release, image]
    if: always() && needs.release.result == 'success' && needs.image.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image names
        id: names
        env:
          GHCR: ghcr.io/${{ github.repository }}
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # OCI references must be lowercase; github.repository keeps the
          # owner's case (YpNo), which buildx refuses in an image name.
          names="$GHCR"
          if [ -n "$HUB_USER" ]; then
            names="$names,docker.io/$HUB_USER/$REPO_NAME"
          fi
          names=$(printf '%s' "$names" | tr '[:upper:]' '[:lower:]')
          echo "list=$names" >> "$GITHUB_OUTPUT"
          echo "ghcr=${names%%,*}" >> "$GITHUB_OUTPUT"
          echo "Publishing to: $names"
      - name: Tag the manifest lists
        env:
          NAMES: ${{ steps.names.outputs.list }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA: ${{ needs.release.outputs.commit }}
        run: |
          cd /tmp/digests
          # The per-platform digests are identical in every registry: the
          # build pushed the same manifests to each one by digest.
          for IMAGE in ${NAMES//,/ }; do
            sources=()
            for digest in *; do
              sources+=("$IMAGE@sha256:$digest")
            done
            docker buildx imagetools create \
              -t "$IMAGE:$VERSION" -t "$IMAGE:latest" -t "$IMAGE:sha-${SHA::7}" \
              "${sources[@]}"
            docker buildx imagetools inspect "$IMAGE:$VERSION"
          done
